<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Z1P Plan Room</title>
<meta name="description" content="Plan room for Z1P-CL-01, a battery and BMS lab. Access code required.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Z1 Power Labs">
<meta property="og:title" content="Z1P-CL-01 Plan room">
<meta property="og:description" content="Battery and BMS lab. Drawings open with an access code from Z1 Power.">
<meta property="og:url" content="https://www.z1plans.com/centerline/">
<meta property="og:image" content="https://www.z1plans.com/home/share-centerline.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
/* Layout: a drawing-sheet world. Left-aligned, one wide stage for the drawing and a narrow reading column beside it; sheet numbers set wide and heavy like a title block. */
:root{
  --bg:#EDF0EA; --panel:#FFFFFF; --ink:#17231D; --mut:#56655D; --line:#C3CBC4;
  --accent:#1D5C40; --on-accent:#FFFFFF; --red:#B93325; --amb:#9A5B0B; --ok:#1D5C40;
  --red-bg:#F8DEDA; --amb-bg:#F7E9CF; --ok-bg:#DCEFE4; --paper:#FBFBF8; --ring:#C6392C;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Archivo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111916; --panel:#19231E; --ink:#E9EEE8; --mut:#9DABA2; --line:#34443C;
  --accent:#6FCF9F; --on-accent:#0E1713; --red:#F08678; --amb:#E9B062; --ok:#6FCF9F;
  --red-bg:#40201C; --amb-bg:#3B2E17; --ok-bg:#1B3528; --paper:#F4F5F1; --ring:#E0483A; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111916; --panel:#19231E; --ink:#E9EEE8; --mut:#9DABA2; --line:#34443C;
  --accent:#6FCF9F; --on-accent:#0E1713; --red:#F08678; --amb:#E9B062; --ok:#6FCF9F;
  --red-bg:#40201C; --amb-bg:#3B2E17; --ok-bg:#1B3528; --paper:#F4F5F1; --ring:#E0483A; color-scheme:dark }
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.cond{font-family:var(--display);font-stretch:62%;font-weight:800;line-height:.92;letter-spacing:-.005em;text-wrap:balance}
.wide{font-family:var(--display);font-stretch:125%;font-weight:900;letter-spacing:-.03em;line-height:1}
.mut{color:var(--mut)}
.btn{display:inline-block;background:var(--accent);color:var(--on-accent);border:0;border-radius:3px;padding:12px 18px;font-weight:650;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}

/* gate */
#gate{min-height:100%;display:grid;place-items:center;padding-block:40px}
#gate form{width:min(460px,100%)}
#gate h1{font-size:clamp(44px,11vw,72px)}
#gate p{margin-top:14px;max-width:38ch}
#gate .row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
#gate input{flex:1;min-width:0;border:2px solid var(--ink);background:var(--panel);padding:13px 14px;border-radius:3px;font-size:18px}
#err{margin-top:12px;color:var(--red);font-weight:600;min-height:1.5em}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
header.top a.home{font-weight:800;text-decoration:none;color:var(--ink);font-size:17px}
header.top .proj{color:var(--mut);font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
header.top a.all{font-weight:650;white-space:nowrap}

main{padding-block:26px 60px}
.sheet-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 22px;margin-bottom:22px}
.sheet-no{font-size:clamp(46px,9vw,84px);color:var(--ink)}
.sheet-title{font-size:clamp(20px,3vw,26px);font-weight:600;padding-bottom:6px}
.issue{margin-left:auto;border:1.5px solid var(--accent);color:var(--accent);padding:7px 12px;border-radius:3px;font-size:14px;font-weight:600}
.issue span{display:block;color:var(--ink);font-weight:400}

/* explainer */
.ex{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:26px;align-items:start;margin-bottom:38px}
.ex-head{grid-column:1/-1}
.ex-head h2{font-size:clamp(38px,6.4vw,74px)}
.ex-head p{margin-top:12px;max-width:62ch;font-size:18px}
.stage{position:relative;background:var(--paper);border:1px solid var(--line);overflow:hidden;width:100%}
.stage img{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none}
.stage .load{position:absolute;inset:0;display:grid;place-items:center;color:#56655D;font-size:14px}
.hit{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:0;background:transparent;padding:0}
.ring{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3.5px solid var(--ring);box-shadow:0 0 0 7px rgba(198,57,44,.22);pointer-events:none}
.ring.sm{width:30px;height:30px;margin:-15px 0 0 -15px;border-width:3px}
@media (prefers-reduced-motion:no-preference){ .ring{animation:pulse 1.8s ease-out infinite} }
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(198,57,44,.45)}100%{box-shadow:0 0 0 20px rgba(198,57,44,0)}}
.side{min-width:0}
.topics{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.topics li{border-bottom:1px solid var(--line)}
.topics button{display:flex;gap:12px;width:100%;text-align:left;background:transparent;border:0;padding:12px 10px;align-items:baseline}
.topics button .n{font-family:var(--display);font-stretch:125%;font-weight:800;min-width:1.7em;color:var(--mut)}
.topics button .tt{font-weight:600}
.topics button .dd{display:none;margin-top:5px;font-weight:400}
.topics li.on button{background:var(--ink);color:var(--bg)}
.topics li.on button .n{color:var(--bg)}
.topics li.on .dd{display:block}
.refs{display:none;padding:0 10px 12px 10px;gap:8px;flex-wrap:wrap;background:var(--ink)}
.topics li.on .refs{display:flex}
.refs a{color:var(--bg);font-weight:650;font-size:14px}
.play{display:flex;align-items:center;gap:12px;margin-top:14px}
.play button{width:48px;height:48px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:17px}
.bar{flex:1;height:4px;background:var(--line);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ring);transition:width .3s}
.note{margin-top:14px;font-size:14px;color:var(--mut);max-width:62ch}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{border:1.5px solid var(--ink);background:transparent;border-radius:3px;padding:7px 12px;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{width:100%;border:2px solid var(--ink);background:var(--panel);padding:10px 12px;border-radius:3px;margin-bottom:8px}
.scroll{max-height:520px;overflow:auto;border-bottom:1px solid var(--line)}

/* equipment pop-up */
.holder{position:relative}
.pop{position:absolute;z-index:3;width:min(330px,82%);background:var(--panel);color:var(--ink);border:2px solid var(--ink);padding:14px 16px 14px;margin:20px 0 0 20px;box-shadow:6px 6px 0 rgba(23,35,29,.18)}
.pop.r{margin-left:0;margin-right:20px}.pop.b{margin-top:0;margin-bottom:20px}
.pop .ph{display:flex;align-items:baseline;gap:10px;padding-right:26px}
.pop .pn{font-size:26px}.pop .pt{font-weight:700;font-size:17px;line-height:1.25}
.pop .pd{font-size:15px;line-height:1.45;margin:8px 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:13px;font-weight:650}
.plink{background:transparent;border:0;padding:0;margin-top:12px;color:var(--accent);font-weight:650;text-decoration:underline;text-align:left}
.pclose{position:absolute;right:6px;top:4px;width:32px;height:32px;border:0;background:transparent;font-size:22px;line-height:1}
.pmore{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
.pmore .pk{font-size:13px;color:var(--mut);margin-top:8px}
.pmore p{font-size:15px;line-height:1.45}

/* checklist */
.rows{display:grid;gap:0;border-top:2px solid var(--ink);margin-top:12px}
.rowc{display:grid;grid-template-columns:104px minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.6fr);gap:6px 18px;padding:13px 0;border-bottom:1px solid var(--line);align-items:start}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.MEETS{background:var(--ok-bg);color:var(--ok)} .pill.CONFIRM{background:var(--amb-bg);color:var(--amb)} .pill.OPEN{background:var(--red-bg);color:var(--red)}
.rowc .it{font-weight:700}
.rowc .lab{display:none;font-size:13px;color:var(--mut)}
.tally{display:flex;height:10px;margin-top:10px;max-width:520px}
.tally i{display:block}

/* compare */
.cmp .top{position:absolute;inset:0;overflow:hidden}
.cmp .handle{position:absolute;top:0;bottom:0;width:3px;background:#17231D;margin-left:-1.5px;pointer-events:none}
.cmp .handle::after{content:"\2194";position:absolute;top:50%;left:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:#17231D;color:#fff;display:grid;place-items:center;font-size:20px}
.cmp .tag{position:absolute;top:10px;background:#17231D;color:#fff;padding:4px 9px;font-size:14px;font-weight:600}
.range{width:100%;margin-top:12px;accent-color:var(--accent)}

/* full sheet */
.full h3{font-size:22px;margin-bottom:10px}
.full button.sheetbtn{display:block;width:100%;padding:0;border:1px solid var(--line);background:var(--paper);position:relative}
.full button.sheetbtn img{display:block;width:100%}
.full .hint{position:absolute;right:12px;bottom:12px;background:#17231D;color:#fff;padding:8px 12px;border-radius:3px;font-weight:650;font-size:14px}
.nav2{display:flex;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap}

/* viewer overlay */
#viewer{position:fixed;inset:0;z-index:50;background:#0d1310;touch-action:none}
#viewer img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none}
#viewer .vbar{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background:rgba(13,19,16,.85);color:#fff;z-index:2}
#viewer .vbar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewer .vbar button{background:#fff;color:#0d1310;border:0;border-radius:3px;min-width:44px;height:40px;font-weight:700;padding:0 12px}

/* home */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-top:16px}
.card{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--panel)}
.card .th{aspect-ratio:3/2;background:var(--paper);overflow:hidden}
.card .th img{width:100%;display:block}
.card .cx{padding:10px 12px 12px}
.card .no{font-size:24px}
.card .ti{font-size:15px}
.card .tag2{font-size:13px;color:var(--accent);font-weight:650;margin-top:2px}
h2.sec{font-size:clamp(30px,5vw,48px);margin-top:10px}
.about{margin:0 0 30px;max-width:66ch}

@media (max-width:820px){
  .ex{grid-template-columns:minmax(0,1fr)}
  .rowc{grid-template-columns:minmax(0,1fr)}
  .rowc .lab{display:block}
  .scroll{max-height:360px}
  .issue{margin-left:0}
  .pop,.pop.r,.pop.b{position:static;width:auto;margin:10px 0 0;box-shadow:none}
  .ring{width:26px;height:26px;margin:-13px 0 0 -13px;border-width:3px;box-shadow:0 0 0 4px rgba(198,57,44,.22)}
  .ring.sm{width:20px;height:20px;margin:-10px 0 0 -10px}
}
</style>
</head>
<body>

<div id="gate" class="wrap">
  <form id="gateform" autocomplete="off">
    <h1 class="cond">Plan room</h1>
    <p>This plan set is shared with reviewers by access code. Enter the code the applicant gave you.</p>
    <div class="row">
      <input id="code" name="code" type="text" inputmode="text" autocapitalize="none" spellcheck="false" aria-label="Access code" placeholder="Access code">
      <button class="btn" type="submit" id="go">Open the plans</button>
    </div>
    <div id="err" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="top"><div class="wrap">
    <a class="home" href="#home">Plan room</a>
    <span class="proj" id="proj"></span>
    <a class="all" href="#sheets">All sheets</a>
  </div></header>
  <main class="wrap" id="view"></main>
</div>
<div id="viewer" hidden></div>

<script>
(function(){
var BASE=(function(){var p=location.pathname;if(p.slice(-1)==='/')return p;var l=p.split('/').pop();return l.indexOf('.')>=0?p.slice(0,p.length-l.length):p+'/';})();
var SALT="2nATOlWNwCwTReFwAzYOnA==", ITER=250000, KEY=null, C=null, IMG={};
function $(t,a){var e=document.createElement(t),i,k;if(a)for(k in a){if(k==='class')e.className=a[k];else if(k==='text')e.textContent=a[k];else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k]);}
  for(i=2;i<arguments.length;i++){var c=arguments[i];if(c==null)continue;e.appendChild(typeof c==='string'?document.createTextNode(c):c);}return e;}
function b64(s){var b=atob(s),u=new Uint8Array(b.length),i;for(i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function derive(code){var enc=new TextEncoder();
  return crypto.subtle.importKey('raw',enc.encode(code.trim().toLowerCase()),'PBKDF2',false,['deriveKey']).then(function(k){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);});}
function grab(path){return fetch(BASE+path).then(function(r){if(!r.ok)throw new Error('load');return r.text();}).then(function(t){var buf=b64(t.trim()).buffer;
    return crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(buf,0,12)},KEY,new Uint8Array(buf,12));});}
function img(id){if(!IMG[id])IMG[id]=grab('s/'+id+'.txt').then(function(b){return URL.createObjectURL(new Blob([b],{type:'image/webp'}));});return IMG[id];}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}

var gate=document.getElementById('gate'),app=document.getElementById('app'),err=document.getElementById('err'),view=document.getElementById('view'),timer=null;
function unlock(code,quiet){
  if(!window.crypto||!crypto.subtle){err.textContent='This browser cannot open the plan set. Try a current version of Chrome, Safari, Edge or Firefox.';return;}
  document.getElementById('go').disabled=true;if(!quiet)err.textContent='Opening…';
  derive(code).then(function(k){KEY=k;return grab('c.txt');}).then(function(buf){
    C=JSON.parse(new TextDecoder().decode(buf));store('z1p-code',code);
    gate.hidden=true;app.hidden=false;document.getElementById('proj').textContent=C.project+', '+C.address;route();
  }).catch(function(e){KEY=null;document.getElementById('go').disabled=false;
    err.textContent=quiet?'':(e&&e.message==='load'?'The plan set could not be loaded. Check your connection and try again.':'That code did not open the plan set. Check it and try again.');});
}
document.getElementById('gateform').addEventListener('submit',function(e){e.preventDefault();var v=document.getElementById('code').value;if(!v.trim()){err.textContent='Enter the access code.';return;}unlock(v);});
var saved=store('z1p-code');if(saved){document.getElementById('code').value=saved;unlock(saved,true);}

function sheet(id){for(var i=0;i<C.sheets.length;i++)if(C.sheets[i].id===id)return C.sheets[i];return null;}
function route(){
  if(!C)return;if(timer){clearInterval(timer);timer=null;}
  var h=(location.hash||'').replace('#','');view.textContent='';
  var s=sheet(h.toUpperCase());
  if(s)pageSheet(s);else pageHome(h==='sheets');
  if(h!=='sheets')window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ---------- stage ---------- */
function stage(sid,crop){
  var ar=((crop[2]-crop[0])*3)/((crop[3]-crop[1])*2);
  var st=$('div',{class:'stage'});st.style.aspectRatio=String(ar);
  var ld=$('div',{class:'load',text:'Loading the drawing…'});st.appendChild(ld);
  var im=$('img',{alt:'Drawing from sheet '+sid});
  im.style.width=(100/(crop[2]-crop[0]))+'%';im.style.left=(-crop[0]/(crop[2]-crop[0])*100)+'%';im.style.top=(-crop[1]/(crop[3]-crop[1])*100)+'%';
  img(sid).then(function(u){im.src=u;st.insertBefore(im,st.firstChild);ld.remove();}).catch(function(){ld.textContent='The drawing could not be loaded.';});
  st.pos=function(m){return [((m[0]-crop[0])/(crop[2]-crop[0])*100)+'%',((m[1]-crop[1])/(crop[3]-crop[1])*100)+'%'];};
  st.clear=function(){var r=st.querySelectorAll('.ring');for(var i=0;i<r.length;i++)r[i].remove();};
  st.rings=function(marks,sm){st.clear();marks.forEach(function(m){var p=st.pos(m),r=$('span',{class:'ring'+(sm?' sm':'')});r.style.left=p[0];r.style.top=p[1];st.appendChild(r);});};
  return st;
}
function refs(t){if(!t.refs||!t.refs.length)return null;var d=$('div',{class:'refs'});t.refs.forEach(function(r){d.appendChild($('a',{href:'#'+r,text:'See sheet '+r}));});return d;}
function exHead(ex){return $('div',{class:'ex-head'},$('h2',{class:'cond',text:ex.head}),$('p',{text:ex.intro}));}

function exTopics(ex,sid,play){
  var box=$('section',{class:'ex'}),st=stage(sid,ex.crop),side=$('div',{class:'side'}),ul=$('ol',{class:'topics'}),cur=-1,items=[],bar,pb,playing=false;
  function sel(i){cur=i;items.forEach(function(li,j){li.className=j===i?'on':'';li.firstChild.setAttribute('aria-expanded',j===i?'true':'false');});
    st.rings(ex.topics[i].marks||[],(ex.topics[i].marks||[]).length>3);if(bar)bar.style.width=((i+1)/ex.topics.length*100)+'%';}
  function stop(){playing=false;if(timer){clearInterval(timer);timer=null;}if(pb){pb.textContent='▶';pb.setAttribute('aria-label','Play');}}
  ex.topics.forEach(function(t,i){
    var b=$('button',{type:'button',onclick:function(){stop();sel(i);}},play?$('span',{class:'n',text:String(i+1)}):null,$('span',null,$('span',{class:'tt',text:t.t}),$('span',{class:'dd',text:t.d})));
    var li=$('li',null,b,refs(t));items.push(li);ul.appendChild(li);
    (t.marks||[]).forEach(function(m){var p=st.pos(m),hb=$('button',{class:'hit',type:'button','aria-label':t.t,onclick:function(){stop();sel(i);}});hb.style.left=p[0];hb.style.top=p[1];st.appendChild(hb);});
  });
  var left=$('div',null,st);
  if(play){bar=$('i');pb=$('button',{type:'button','aria-label':'Play',text:'▶',onclick:function(){
      if(playing){stop();return;}playing=true;pb.textContent='❚❚';pb.setAttribute('aria-label','Pause');
      if(cur>=ex.topics.length-1)sel(0);
      timer=setInterval(function(){if(cur>=ex.topics.length-1){stop();return;}sel(cur+1);},4200);}});
    left.appendChild($('div',{class:'play'},pb,$('div',{class:'bar'},bar),$('span',{class:'mut',text:ex.topics.length+' steps'})));}
  side.appendChild(ul);if(ex.note)side.appendChild($('p',{class:'note',text:ex.note}));
  box.appendChild(exHead(ex));box.appendChild(left);box.appendChild(side);sel(0);return box;
}

function exEquip(ex,sid){

function explainer(ex,sid){if(ex.kind==='play')return exTopics(ex,sid,true);if(ex.kind==='pick')return exTopics(ex,sid,false);if(ex.kind==='equip')return exEquip(ex,sid);if(ex.kind==='check')return exCheck(ex);if(ex.kind==='compare')return exCompare(ex);return null;}

/* ---------- zoom viewer ---------- */
var V=document.getElementById('viewer');
function openViewer(s){
  V.textContent='';V.hidden=false;var im=$('img',{alt:'Sheet '+s.id}),st={s:1,x:0,y:0},iw=4320,ih=2880,pts={},last=null;
  function apply(){im.style.transform='translate('+st.x+'px,'+st.y+'px) scale('+st.s+')';}
  function fit(){var w=V.clientWidth,h=V.clientHeight-60;st.s=Math.min(w/iw,h/ih);st.x=(w-iw*st.s)/2;st.y=60+(h-ih*st.s)/2;apply();}
  function zoom(f,cx,cy){var ns=Math.max(.05,Math.min(4,st.s*f));f=ns/st.s;st.x=cx-(cx-st.x)*f;st.y=cy-(cy-st.y)*f;st.s=ns;apply();}
  function close(){V.hidden=true;V.textContent='';document.removeEventListener('keydown',key);}
  function key(e){if(e.key==='Escape')close();if(e.key==='+'||e.key==='=')zoom(1.3,V.clientWidth/2,V.clientHeight/2);if(e.key==='-')zoom(1/1.3,V.clientWidth/2,V.clientHeight/2);}
  var bar=$('div',{class:'vbar'},$('b',{text:s.id+'  '+s.title}),
    $('button',{type:'button','aria-label':'Zoom out',text:'−',onclick:function(){zoom(1/1.4,V.clientWidth/2,V.clientHeight/2);}}),
    $('button',{type:'button','aria-label':'Zoom in',text:'+',onclick:function(){zoom(1.4,V.clientWidth/2,V.clientHeight/2);}}),
    $('button',{type:'button',text:'Fit',onclick:fit}),$('button',{type:'button',text:'Close',onclick:close}));
  V.appendChild(im);V.appendChild(bar);
  img(s.id).then(function(u){im.onload=function(){iw=im.naturalWidth;ih=im.naturalHeight;fit();};im.src=u;});
  V.onpointerdown=function(e){if(e.target.closest('.vbar'))return;V.setPointerCapture(e.pointerId);pts[e.pointerId]=[e.clientX,e.clientY];last=null;};
  V.onpointermove=function(e){if(!pts[e.pointerId])return;var ids=Object.keys(pts);
    if(ids.length===1){st.x+=e.clientX-pts[e.pointerId][0];st.y+=e.clientY-pts[e.pointerId][1];pts[e.pointerId]=[e.clientX,e.clientY];apply();}
    else if(ids.length===2){pts[e.pointerId]=[e.clientX,e.clientY];var a=pts[ids[0]],b=pts[ids[1]],d=Math.hypot(a[0]-b[0],a[1]-b[1]),cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2;if(last)zoom(d/last,cx,cy);last=d;}};
  V.onpointerup=V.onpointercancel=function(e){delete pts[e.pointerId];last=null;};
  V.onwheel=function(e){e.preventDefault();zoom(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY);};
  V.ondblclick=function(e){if(e.target.closest('.vbar'))return;zoom(1.8,e.clientX,e.clientY);};
  document.addEventListener('keydown',key);fit();
}
})();
